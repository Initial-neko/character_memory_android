name: Android P1 prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-p1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit:
    name: Build / Lint / JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: P1 boundary and screen-tag static assertions
        run: python3 scripts/verify_p1_boundaries.py
      - name: Install API 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Gradle, Lint, JVM tests and Debug APK
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug --stacktrace
      - name: Summarize test evidence
        if: always()
        run: python3 scripts/summarize_evidence.py --mode jvm --output artifacts/p1-jvm-evidence.json
      - name: Upload APK / JUnit / lint / evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-build-unit-evidence
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/
            app/build/test-results/
            app/build/reports/
            artifacts/*.json

  emulator-ui:
    name: Emulator / UI flows / actual screenshots
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator Compose UI tests and screen capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon connectedDebugAndroidTest --stacktrace
            result=$?
            mkdir -p artifacts/screenshots
            adb pull /sdcard/Pictures/CharacterMemoryP1 artifacts/screenshots || true
            adb logcat -d -t 3000 > artifacts/emulator-logcat.txt || true
            exit $result
      - name: Summarize instrumented evidence
        if: always()
        run: python3 scripts/summarize_evidence.py --mode emulator --output artifacts/p1-emulator-evidence.json
      - name: Upload screenshots / reports / logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-emulator-ui-evidence
          if-no-files-found: warn
          path: |
            artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
