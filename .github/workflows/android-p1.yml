name: Android P1 regression / P2 client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-p1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-unit:
    name: Build / Lint / JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable acceptance signing key
        env:
          ACCEPTANCE_KEYSTORE: ${{ secrets.ANDROID_ACCEPTANCE_KEYSTORE }}
        run: |
          if [ -n "$ACCEPTANCE_KEYSTORE" ]; then
            printf '%s' "$ACCEPTANCE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/acceptance-debug.keystore"
            echo "ANDROID_ACCEPTANCE_KEYSTORE_PATH=$RUNNER_TEMP/acceptance-debug.keystore" >> "$GITHUB_ENV"
            keytool -exportcert -alias androiddebugkey -storepass android -keystore "$RUNNER_TEMP/acceptance-debug.keystore" | sha256sum | grep -F '4b9f3735586a0d99b6af9a5ad7afaf792a6bced2095dc6430a392c21c212800a'
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Main delivery requires ANDROID_ACCEPTANCE_KEYSTORE" >&2
            exit 1
          fi
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Evidence summarizer regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Reject version regressions and record delivery provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/verify_delivery_version.py --base-ref "$BASE_SHA" --output artifacts/delivery-version.json
      - name: P1 offline boundary and screen-tag static assertions
        run: python3 scripts/verify_p1_boundaries.py
      - name: Verify official Gradle Wrapper checksum
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          ./gradlew --version
          grep -F 'distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' gradle/wrapper/gradle-wrapper.properties
      - name: Install API 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify Lint, JVM execution 1 and Debug APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug --rerun-tasks --stacktrace
      - name: Preserve JVM execution 1 evidence
        if: always()
        run: |
          mkdir -p artifacts/jvm-run-1
          cp -R app/build/test-results/testDebugUnitTest artifacts/jvm-run-1/
      - name: Verify APK acceptance certificate
        if: always() && env.ANDROID_ACCEPTANCE_KEYSTORE_PATH != ''
        run: |
          mkdir -p artifacts
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > artifacts/apk-signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 4b9f3735586a0d99b6af9a5ad7afaf792a6bced2095dc6430a392c21c212800a' artifacts/apk-signature.txt
      - name: Summarize P1 JVM execution 1
        if: always()
        run: python3 scripts/summarize_evidence.py --mode jvm --output artifacts/jvm-run-1/p1-jvm-evidence.json
      - name: Summarize P2 JVM execution 1
        if: always()
        run: python3 scripts/summarize_evidence.py --mode jvm --profile p2 --output artifacts/jvm-run-1/p2-jvm-evidence.json
      - name: Independent JVM execution 2
        if: always()
        run: |
          rm -rf app/build/test-results/testDebugUnitTest
          ./gradlew --no-daemon testDebugUnitTest --rerun-tasks --stacktrace
      - name: Preserve JVM execution 2 evidence
        if: always()
        run: |
          mkdir -p artifacts/jvm-run-2
          cp -R app/build/test-results/testDebugUnitTest artifacts/jvm-run-2/
      - name: Summarize P1 JVM execution 2
        if: always()
        run: python3 scripts/summarize_evidence.py --mode jvm --output artifacts/jvm-run-2/p1-jvm-evidence.json
      - name: Summarize P2 JVM execution 2
        if: always()
        run: python3 scripts/summarize_evidence.py --mode jvm --profile p2 --output artifacts/jvm-run-2/p2-jvm-evidence.json
      - name: Upload APK / JUnit / lint / evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-build-unit-evidence
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/
            app/build/test-results/
            app/build/reports/
            artifacts/

  emulator-ui:
    name: Emulator / UI flows / actual screenshots
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable acceptance signing key
        env:
          ACCEPTANCE_KEYSTORE: ${{ secrets.ANDROID_ACCEPTANCE_KEYSTORE }}
        run: |
          if [ -n "$ACCEPTANCE_KEYSTORE" ]; then
            printf '%s' "$ACCEPTANCE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/acceptance-debug.keystore"
            echo "ANDROID_ACCEPTANCE_KEYSTORE_PATH=$RUNNER_TEMP/acceptance-debug.keystore" >> "$GITHUB_ENV"
            keytool -exportcert -alias androiddebugkey -storepass android -keystore "$RUNNER_TEMP/acceptance-debug.keystore" | sha256sum | grep -F '4b9f3735586a0d99b6af9a5ad7afaf792a6bced2095dc6430a392c21c212800a'
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Main delivery requires ANDROID_ACCEPTANCE_KEYSTORE" >&2
            exit 1
          fi
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile app and tests before starting the emulator
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator Compose UI tests and screen capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Use deterministic Camera2 sources on the headless software GPU runner.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/run_emulator_acceptance.sh
      - name: Summarize P1 instrumented evidence
        if: always()
        run: python3 scripts/summarize_evidence.py --mode emulator --output artifacts/p1-emulator-evidence.json
      - name: Print bounded instrumented failure details
        if: always()
        run: python3 scripts/print_ui_failures.py
      - name: Summarize P2 instrumented evidence
        if: always()
        run: python3 scripts/summarize_evidence.py --mode emulator --profile p2 --min-tests 40 --output artifacts/p2-emulator-evidence.json
      - name: Upload screenshots / reports / logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-emulator-ui-evidence
          if-no-files-found: error
          path: |
            app/build/outputs/apk/
            artifacts/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
